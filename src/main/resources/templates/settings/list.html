<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Hospital Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 1.5em;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: #e74c3c;
            border-radius: 5px;
            transition: 0.3s;
        }
        .navbar a:hover {
            background: #c0392b;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
        }
        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header h2 {
            color: #2c3e50;
        }
        .settings-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn-save {
            background: #27ae60;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-save:hover {
            background: #229954;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System</h1>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s;">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="/admin/dashboard">Dashboard</a> > Settings
        </div>

        <div class="header">
            <h2>⚙️ System Settings</h2>
        </div>

        <div class="settings-form">
            <form>
                <h3 style="margin-bottom: 20px; color: #2c3e50;">Hospital Information</h3>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Hospital Name</label>
                        <input type="text" value="City Hospital" placeholder="Enter hospital name">
                    </div>
                    <div class="form-group">
                        <label>Registration Number</label>
                        <input type="text" value="REG-2024-001" placeholder="Enter registration number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="info@hospital.com" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" value="+1 (555) 123-4567" placeholder="Enter phone number">
                    </div>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" value="123 Medical Street, Healthcare City" placeholder="Enter address">
                </div>

                <div class="form-group">
                    <label>City/State</label>
                    <input type="text" value="Healthcare City, State" placeholder="Enter city/state">
                </div>

                <h3 style="margin: 30px 0 20px 0; color: #2c3e50;">System Configuration</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>Appointment Duration (minutes)</label>
                        <input type="number" value="30" min="15" max="120">
                    </div>
                    <div class="form-group">
                        <label>Max Patients Per Day</label>
                        <input type="number" value="50" min="1" max="500">
                    </div>
                </div>

                <div class="form-group">
                    <label>Working Hours Start</label>
                    <input type="text" value="09:00 AM" placeholder="HH:MM AM/PM">
                </div>

                <div class="form-group">
                    <label>Working Hours End</label>
                    <input type="text" value="05:00 PM" placeholder="HH:MM AM/PM">
                </div>

                <button type="button" class="btn-save">💾 Save Settings</button>
            </form>
        </div>
    </div>
</body>
</html>
