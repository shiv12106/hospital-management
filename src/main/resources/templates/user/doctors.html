<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Doctors - Hospital Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: #27ae60;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 1.5em;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
        }
        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header h2 {
            color: #2c3e50;
        }
        .doctor-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
        }
        .doctor-avatar {
            width: 80px;
            height: 80px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
        }
        .doctor-info h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .doctor-info p {
            color: #666;
            margin: 3px 0;
            font-size: 0.9em;
        }
        .btn-contact {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-contact:hover {
            background: #229954;
        }
        .no-data {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            color: #999;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System</h1>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="/user/dashboard">Dashboard</a> > My Doctors
        </div>

        <div class="header">
            <h2>👨‍⚕️ My Doctors</h2>
        </div>

        <div th:if="${#lists.isEmpty(doctors)}" class="no-data">
            <p>No doctors assigned yet. Contact your hospital administrator to get assigned to a doctor.</p>
        </div>

        <div th:if="${!#lists.isEmpty(doctors)}">
            <div th:each="doctor : ${doctors}" class="doctor-card">
                <div class="doctor-avatar">👨‍⚕️</div>
                <div class="doctor-info">
                    <h3 th:text="${doctor.name}"></h3>
                    <p><strong>Specialization:</strong> <span th:text="${doctor.specialization}"></span></p>
                    <p><strong>Department:</strong> <span th:text="${doctor.department.name}"></span></p>
                    <p><strong>Experience:</strong> <span th:text="${doctor.experience} + ' years'"></span></p>
                    <p><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${doctor.phone}"></span></p>
                </div>
                <button class="btn-contact">Contact Doctor</button>
            </div>
        </div>
    </div>
</body>
</html>
