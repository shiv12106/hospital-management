<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Hospital Management System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .navbar { background: #27ae60; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5em; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .breadcrumb { margin-bottom: 20px; color: #666; }
        .breadcrumb a { color: #3498db; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { margin: 0; }
        .profile-content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .profile-info { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .info-row { display: flex; gap: 20px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .info-label { font-weight: 600; width: 150px; color: #2c3e50; }
        .info-value { color: #555; }
        .sidebar { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .sidebar h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        .sidebar a { display: block; padding: 10px; margin-bottom: 8px; background: #27ae60; color: white; text-decoration: none; border-radius: 5px; text-align: center; transition: 0.3s; }
        .sidebar a:hover { background: #229954; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System</h1>
        <form action="/logout" method="post" style="margin:0;"><button type="submit" class="logout-btn">Logout</button></form>
    </div>
    <div class="container">
        <div class="breadcrumb">
            <a href="/user/dashboard">Dashboard</a> > Profile
        </div>
        <div class="header">
            <h2>👤 My Profile</h2>
        </div>
        <div class="profile-content">
            <div class="profile-info">
                <h3 style="margin-top:0; border-bottom:2px solid #27ae60; padding-bottom:10px;">Personal Information</h3>
                <div class="info-row"><div class="info-label">Username:</div><div class="info-value" th:text="${user.username}"></div></div>
                <div class="info-row"><div class="info-label">Email:</div><div class="info-value" th:text="${user.email}"></div></div>
                <div class="info-row"><div class="info-label">Role:</div><div class="info-value" th:text="${user.role}"></div></div>
                <h3 style="border-bottom:2px solid #27ae60; padding-bottom:10px; margin-top:20px;">Associated Patients</h3>
                <div th:if="${#lists.isEmpty(patients)}" style="color:#999;">No patients found</div>
                <ul style="list-style: none; padding: 0;">
                    <li th:each="p : ${patients}" style="padding:8px; background:#f9f9f9; margin-bottom:8px; border-radius:5px;">
                        <strong th:text="${p.name}"></strong>
                        <br/>
                        <small style="color:#666;" th:text="${'Blood Group: ' + p.bloodGroup + ' | DOB: ' + p.dateOfBirth}"></small>
                    </li>
                </ul>
            </div>
            <div class="sidebar">
                <h3>⚙️ Quick Links</h3>
                <a href="/user/settings">Go to Settings</a>
                <a href="/user/profile">Edit Profile</a>
                <a href="/user/dashboard">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
