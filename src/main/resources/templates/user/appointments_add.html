<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Appointment - HMS</title>
    <style>
        /* reuse basic styles from appointments.html */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .navbar { background: #27ae60; padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { font-size: 1.5em; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
        .form-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #2c3e50; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; font-family: inherit; }
        .btn-save { background: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-save:hover { background: #229954; }
        .breadcrumb { margin-bottom: 20px; color: #666; }
        .breadcrumb a { color: #3498db; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System</h1>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="/user/dashboard">Dashboard</a> &gt; <a href="/user/appointments">My Appointments</a> &gt; Schedule
        </div>

        <div class="header">
            <h2>📅 Schedule New Appointment</h2>
        </div>

        <div class="form-container">
            <form method="post" action="/user/appointments/add">
                <div class="form-group">
                    <label>Patient *</label>
                    <select name="patientId" required>
                        <option value="">--Select--</option>
                        <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor *</label>
                    <select name="doctorId" required>
                        <option value="">--Select--</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select name="departmentId">
                        <option value="">--None--</option>
                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date & Time *</label>
                    <input type="datetime-local" name="dateTime" required>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <input type="text" name="reason">
                </div>
                <button type="submit" class="btn-save">Schedule</button>
            </form>
        </div>
    </div>
</body>
</html>
