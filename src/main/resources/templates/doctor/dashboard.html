<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Hospital Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 1.5em;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .nav-links a:hover {
            background: #34495e;
        }
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
        }
        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .welcome-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .welcome-section h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .welcome-section p {
            color: #666;
            font-size: 1.05em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-left: 5px solid #3498db;
        }
        .stat-card.patients {
            border-left-color: #27ae60;
        }
        .stat-card.appointments {
            border-left-color: #f39c12;
        }
        .stat-card.reports {
            border-left-color: #e74c3c;
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #7f8c8d;
            font-size: 0.95em;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-top: 30px;
        }
        .table-container h3 {
            background: #34495e;
            color: white;
            padding: 15px 20px;
            margin: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #ecf0f1;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
        }
        tbody tr:hover {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System - Doctor</h1>
        <div style="display: flex; gap: 15px; align-items: center;">
            <div class="nav-links">
                <a href="/doctor/dashboard">Dashboard</a>
                <a href="/doctor/patients">Patients</a>
                <a href="/doctor/prescriptions">Prescriptions</a>
                <a href="/doctor/appointments">Appointments</a>
                <a href="/doctor/reports">Reports</a>
            </div>
            <div style="background: rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 5px; font-size: 0.95em; white-space: nowrap;">
                📞 <strong>Help Line:</strong> +1-800-HOSPITAL
            </div>
            <form action="/logout" method="post" style="margin:0;">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="breadcrumb">
            Dashboard > Overview
        </div>

        <div class="welcome-section">
            <h2 th:if="${doctor}" th:text="'Welcome, Dr. ' + ${doctor.name}"></h2>
            <h2 th:unless="${doctor}">Welcome, Doctor</h2>
            <p th:if="${doctor}" th:text="'Specialization: ' + ${doctor.specialization}"></p>
        </div>

        <div class="stats-grid">
            <div class="stat-card patients">
                <div class="stat-number" th:text="${totalPatients}">0</div>
                <div class="stat-label">Total Patients</div>
            </div>
            <div class="stat-card appointments">
                <div class="stat-number" th:text="${totalAppointments}">0</div>
                <div class="stat-label">Appointments</div>
            </div>
            <div class="stat-card reports">
                <div class="stat-number" th:text="${totalReports}">0</div>
                <div class="stat-label">Reports</div>
            </div>
        </div>

        <div class="table-container" th:if="${not #lists.isEmpty(appointments)}">
            <h3>📅 Upcoming Appointments</h3>
            <table>
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Department</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="appointment : ${appointments.stream().limit(5).toList()}">
                        <td th:text="${appointment.patient.name}"></td>
                        <td th:text="${#temporals.format(appointment.appointmentDate, 'MMM dd, yyyy')}"></td>
                        <td th:text="${#temporals.format(appointment.appointmentDate, 'hh:mm a')}"></td>
                        <td th:text="${appointment.department.name != null ? appointment.department.name : 'N/A'}"></td>
                        <td th:text="${appointment.status}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
