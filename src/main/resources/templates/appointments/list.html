<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Hospital Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .navbar {
            background: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            font-size: 1.5em;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: #e74c3c;
            border-radius: 5px;
            transition: 0.3s;
        }
        .navbar a:hover {
            background: #c0392b;
        }
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            color: #2c3e50;
        }
        .btn-add {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-add:hover {
            background: #229954;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #34495e;
            color: white;
        }
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 15px;
            border-bottom: 1px solid #ecf0f1;
        }
        tbody tr:hover {
            background: #f9f9f9;
        }
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            margin: 0 5px;
            border-radius: 3px;
            text-decoration: none;
            font-size: 0.9em;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .btn-edit {
            background: #3498db;
            color: white;
        }
        .btn-edit:hover {
            background: #2980b9;
        }
        .btn-delete {
            background: #e74c3c;
            color: white;
        }
        .btn-delete:hover {
            background: #c0392b;
        }
        .breadcrumb {
            margin-bottom: 20px;
            color: #666;
        }
        .breadcrumb a {
            color: #3498db;
            text-decoration: none;
        }
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🏥 Hospital Management System</h1>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" style="background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; transition: 0.3s;">Logout</button>
        </form>
    </div>

    <div class="container">
        <div class="breadcrumb">
            <a href="/admin/dashboard">Dashboard</a> > Appointments
        </div>

        <div class="header">
            <h2>📅 Appointments Management</h2>
        </div>

        <div class="form-container" style="margin-bottom:30px;">
            <h3 style="color:#2c3e50;">Schedule New Appointment</h3>
            <form method="post" action="/admin/appointments">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;">
                    <div class="form-group">
                        <label>Patient *</label>
                        <select name="patientId" required>
                            <option value="">--Select--</option>
                            <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Doctor *</label>
                        <select name="doctorId" required>
                            <option value="">--Select--</option>
                            <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select name="departmentId">
                            <option value="">--None--</option>
                            <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date & Time *</label>
                        <input type="datetime-local" name="dateTime" required>
                    </div>
                    <div class="form-group">
                        <label>Reason</label>
                        <input type="text" name="reason">
                    </div>
                    <div class="form-group">
                        <label>Status *</label>
                        <select name="status" required>
                            <option value="SCHEDULED">Scheduled</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                </div>
                <button class="btn-add" type="submit" style="margin-top:15px;">+ Schedule</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="7" style="text-align: center; color: #999;">No appointments found. <a href="#" style="color: #3498db;">Schedule one now.</a></td>
                    </tr>
                    <tr th:each="appt : ${appointments}">
                        <td th:text="${appt.id}"></td>
                        <td th:text="${appt.patient != null ? appt.patient.name : 'N/A'}"></td>
                        <td th:text="${appt.doctor != null ? appt.doctor.name : 'N/A'}"></td>
                        <td th:text="${appt.appointmentDate != null ? #temporals.format(appt.appointmentDate, 'yyyy-MM-dd') : ''}"></td>
                        <td th:text="${appt.appointmentDate != null ? #temporals.format(appt.appointmentDate, 'HH:mm') : ''}"></td>
                        <td th:text="${appt.status != null ? appt.status : 'UNKNOWN'}"></td>
                        <td>
                            <a th:href="@{/admin/appointments/edit/{id}(id=${appt.id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/admin/appointments/delete/{id}(id=${appt.id})}" class="btn-delete" onclick="return confirm('Are you sure you want to delete this appointment?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
