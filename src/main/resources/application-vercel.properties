# Vercel-specific Configuration
spring.application.name=hospital

# Server Configuration for Vercel
server.port=8080

# Database Configuration for Vercel (using PostgreSQL via Vercel Postgres)
spring.datasource.url=jdbc:postgresql://${VERCEL_POSTGRES_HOST}:${VERCEL_POSTGRES_PORT}/${VERCEL_POSTGRES_DB}
spring.datasource.username=${VERCEL_POSTGRES_USER}
spring.datasource.password=${VERCEL_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disable in production)
spring.h2.console.enabled=false

# Logging Configuration for Vercel
logging.level.root=WARN
logging.level.com.hms.hospital=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Session Configuration for serverless
spring.session.store-type=jdbc
spring.session.timeout=1800
spring.session.jdbc.initialize-schema=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Vercel-specific optimizations
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
